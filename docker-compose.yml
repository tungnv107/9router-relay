name: 9router-relay

services:
  router:
    image: 9router-relay:local
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.5.112-relay}
    container_name: 9router-relay
    init: true
    restart: unless-stopped
    ports:
      - "${ROUTER_BIND_IP:-127.0.0.1}:${ROUTER_PORT:-20128}:20128"
    volumes:
      - router-data:/app/data
      - router-home:/app/data-home
    env_file: .env
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:?Set INITIAL_PASSWORD in .env}
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      CH_RELAY_BASE_URL: http://ch-relay:11500/v1
      CH_RELAY_ALLOWED_ORIGINS: http://ch-relay:11500
    depends_on:
      ch-relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20128/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ch-relay:
    image: ch-relay-local:1.1.96
    build:
      context: ./vendor/ch-relay
      dockerfile: ../../deploy/ch-relay/Dockerfile
    container_name: ch-relay-local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CH_RELAY_ADMIN_PORT:-11504}:11504"
    expose:
      - "11500"
    volumes:
      - relay-data:/data
    environment:
      CH_HOME: /data
      CH_PORT: "0"
      CH_SHARE_PORT: "11500"
      CH_ADMIN_PORT: "11504"
      CH_QUOTA_POLL_MS: "0"
      CH_AUTO_POOL_GUARD: "0"
      CH_AUTO_UPDATE: "0"
      CH_TELEMETRY: "0"
      CH_CACHE_MS: "0"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:11500/healthz');process.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  router-data:
  router-home:
  relay-data:
